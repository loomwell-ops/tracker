name: Rebuild tracker demo
on:
  push:
    branches: [main]
    paths: [index.html, app.js, build-tracker-demo.mjs]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build-tracker-demo.mjs
      - name: Commit rebuilt demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo.html demo.js
          git diff --cached --quiet || (git commit -m "Rebuild demo" && git push)
